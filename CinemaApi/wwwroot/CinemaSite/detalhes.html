<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*fonte baixada e administrada localmente para não dar erro de permissão como com os links*/

        @font-face {
            font-family: 'Montserrat';
            src: url('fonts/Montserrat-VariableFont_wght.ttf') format('truetype-variations');
            font-weight: 100 900;
            /* Vai do Thin (100) ao Black (900) */
            font-style: normal;
            font-display: swap;
        }

        * {
            border: 0;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Evita que padding estoure o tamanho dos elementos */
        }

        body,
        html {
            background-color: #0F0A1C;
            font-family: "Montserrat", sans-serif;
            color: #FFFFFF;
        }


        .conteudo-detalhe {
            display: flex;
            align-items: flex-start;
            gap: 40px;
            max-width: 1100px;
            margin: 50px auto;
            padding: 30px;
        }

        .poster-detalhe {
            width: 300px;
            height: 440px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        }

        .info-detalhe {
            flex: 1;
            color: white;
        }

        .info-detalhe h1 {
            font-size: 36px;
            margin: 0 0 15px;
        }

        .meta-info {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .info-detalhe h3 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #CE47A2;
        }

        .sinopse {
            font-size: 17px;
            line-height: 1.7;
            color: #ddd;
            text-align: justify;
        }

        /* Responsividade para celulares */
        @media (max-width: 650px) {
            .conteudo-detalhe {
                flex-direction: column;
                align-items: center;
                padding: 20px;
                gap: 25px;
            }

            .poster-detalhe {
                width: 220px;
                height: 330px;
            }

            .info-detalhe h1 {
                font-size: 28px;
            }
        }

        .btn-comprar {
            margin-top: 30px;
            padding: 15px 35px;
            background-color: #CE47A2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        .btn-comprar:hover {
            background-color: #CE47A2;
            transform: translateY(-2px);
        }

        .btn-comprar:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <div class="Detalhe" id="detalhe-filme">

    </div>


</body>
<script src="Scripts/detalhe.js"></script>
<script src="Scripts/selecionarSession.js"></script>

</html>
