<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Filme</title>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            
        }

        body {
            background-color: #0F0A1C;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }

        .form-container {
             background-color: #160F29;
            padding: 32px;
            border-radius: 12px;
            width: 100%;
            max-width: 30rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 1.5rem;
             font-family: "Orbitron", sans-serif;
            color: #f3f4f6;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            font-family: "Sniglet", system-ui;
        }

        .formItem {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
             color: #ffffff;
            font-size: 0.9rem;
           
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
           border: 1px solid #2D1E54;
            background: linear-gradient(145deg, #1A1230, #130C24);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
              transform: translateY(-4px);
            border-color: #B22282;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        button {
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #B22282;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
           background-color: #2D1E54;
        }


        /* 1. Ajustes para Celulares (telas menores que 480px) */
@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .form-container {
        padding: 20px 16px;
        border-radius: 8px;
    }

    h2 {
        font-size: 1.25rem;
        margin-bottom: 18px;
    }

    input, textarea {
        padding: 10px;
        font-size: 0.95rem;
    }

    input[type="file"] {
        padding: 6px;
        font-size: 0.85rem;
    }

    button {
        padding: 12px;
    }

     .voltar {
                position: static;
                align-self: flex-start;
                margin: 0;
                padding: 0.6rem 1rem;
            }
}

/* 2. TVs Full HD e 4K com escala do Windows (1920px) */
@media (min-width: 1920px) {
    .form-container {
        max-width: 45rem;
        padding: 48px;
        border-radius: 16px;
    }

    h2 {
        font-size: 2.2rem;
        margin-bottom: 32px;
    }

    form {
        gap: 1.4rem;
    }

    label {
        font-size: 1.25rem;
    }

    input, textarea {
        padding: 16px;
        font-size: 1.3rem;
        border-radius: 8px;
    }

    textarea {
        min-height: 120px;
    }

    input[type="file"] {
        padding: 12px;
        font-size: 1.2rem;
    }

    button {
        padding: 18px;
        font-size: 1.35rem;
        border-radius: 8px;
        margin-top: 12px;
    }
}

/* 3. TVs 4K nativas sem zoom do Windows (2560px+) */
@media (min-width: 2560px) {
    .form-container {
        max-width: 65rem;
        padding: 64px;
        border-radius: 20px;
    }

    h2 {
        font-size: 3rem;
        margin-bottom: 42px;
    }

    form {
        gap: 1.8rem;
    }

    label {
        font-size: 1.7rem;
    }

    input, textarea {
        padding: 22px;
        font-size: 1.8rem;
        border-radius: 10px;
    }

    textarea {
        min-height: 160px;
    }

    input[type="file"] {
        padding: 16px;
        font-size: 1.6rem;
    }

    button {
        padding: 24px;
        font-size: 1.9rem;
        border-radius: 10px;
        margin-top: 16px;
    }
}


.voltar {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            text-align: center;
            background-color: transparent;
            border: 1px solid #B22282;
            color: #B22282;
            padding: 0.6rem 1.1rem;
            border-radius: 0.4rem;
            font-family: "Sniglet", system-ui;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .voltar:hover {
            background-color: #B22282;
            color: #fff;
        }
    </style>
</head>
<body>
     <a href="../ListarPages/listarMovies.html" class="voltar">Voltar</a>
    <div class="form-container">
        <h2>Editar Filme</h2>
        <form id="EditarMovie">
            <div class="formItem">
                <label for="TitleMovie">Título</label>
                <input type="text" id="TitleMovie" name="TitleMovie" required>
            </div>

            <div class="formItem">
                <label for="SynopsisMovie">Sinopse</label>
                <textarea id="SynopsisMovie" name="SynopsisMovie"  required></textarea>
            </div>

            <div class="formItem">
                <label for="DurationMovie">Duração (em minutos)</label>
                <input type="number" id="DurationMovie" name="DurationMovie"   required>
            </div>

            <div class="formItem">
                <label for="GenreMovie">Gênero</label>
                <input type="text" id="GenreMovie" name="GenreMovie"  required>
            </div>

            <div class="formItem">
                <label for="AgeRatingMovie">Classificação indicativa</label>
                <input type="number" id="AgeRatingMovie" name="AgeRatingMovie"  min="0" max="18" required>
            </div>

            <div class="formItem">

                <label>Foto Atual:</label>
                <img id="PreviewFoto" src="" alt="Foto do filme" style="width: 9.5rem;
            height: 5.5rem; object-fit: cover;  display: block; margin-bottom: 8px;">
                


                <label for="PhotoMovie">Capa do Filme</label>
                <input type="file" id="PhotoMovie" name="PhotoMovie" accept="image/*" >
            </div>

            <button type="submit">Editar Filme</button>
        </form>
    </div>

    <script src="/Dashboard/Scripts/movie.js"></script>
</body>
</html>
