<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100vh;
            background-color: #0F0A1C;
            font-family: "Montserrat", sans-serif;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 20%;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            border: 1px solid #B22282;
            background-color: #160F29;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border-radius: 0.5rem;
            gap: 2rem;
        }

        h3 {
            align-self: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .formGroup {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 500;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2D1E54;
            background: linear-gradient(145deg, #1A1230, #130C24);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus {
            transform: translateY(-4px);
            border-color: #B22282;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        button {
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #B22282;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2D1E54;
        }

        .btn-sair {
            text-align: center;
            text-decoration: none;
            background-color: transparent;
            color: #E25583;
            width: 100%;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s ease;
        }

        .btn-sair:hover {
            color: #d61f5c;
        }
    </style>
</head>

<body>
    <div class="box">
        <form>
            <h3>Cadastre-se</h3>

            <div class="formGroup">
                <label for="nome">Nome:</label>
                <input type="text" id="nomeUsers" name="nomeUsers" placeholder="Digite seu nome" required>
            </div>

            <div class="formGroup">
                <label for="email">Email:</label>
                <input type="text" id="emailUsers" name="emailUsers" placeholder="Digite seu e-mail" required>
            </div>

            <div class="formGroup">
                <label for="senha">Senha:</label>
                <input type="password" id="senhaUsers" name="senhaUsers" placeholder="Digite sua senha" required>
            </div>

            <button type="submit">Cadastrar</button>
            <a href="login.html" class="btn-sair">Voltar</a>
        </form>
    </div>

    <script>
        const API_SERVIDOR = "http://localhost:5252";
        const formCadastro = document.querySelector("form");

        formCadastro.addEventListener("submit", async (event) => {
            // Impede a página de recarregar
            event.preventDefault();

            const nome = document.getElementById("nomeUsers").value.trim();
            const email = document.getElementById("emailUsers").value.trim();
            const senha = document.getElementById("senhaUsers").value;

            // A sua UsersController usa [FromForm], então usamos FormData
            const formData = new FormData();
            formData.append("NameUsers", nome);
            formData.append("EmailUsers", email);
            formData.append("PasswordUsers", senha);
            formData.append("RoleUsers", "Client"); // Mesmo valor do EnumRoleUsers no C#

            try {
                const resposta = await fetch(`${API_SERVIDOR}/api/Users`, {
                    method: "POST",
                    body: formData
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    alert(resultado.message || "Cadastro realizado com sucesso!");
                    // Redireciona para o login do site
                    window.location.href = "login.html";
                } else {
                    alert(resultado.message || "Erro ao realizar cadastro.");
                }
            } catch (erro) {
                console.error("Erro ao cadastrar:", erro);
                alert("Não foi possível conectar ao servidor.");
            }
        });
    </script>

</body>

</html>
