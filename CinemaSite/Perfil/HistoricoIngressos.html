<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico</title>
    <style>
        /*fonte baixada e administrada localmente para não dar erro de permissão como com os links*/

        @font-face {
            font-family: 'Montserrat';
            src: url('fonts/Montserrat-VariableFont_wght.ttf') format('truetype-variations');
            font-weight: 100 900;
            /* Vai do Thin (100) ao Black (900) */
            font-style: normal;
            font-display: swap;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0F0A1C;
            color: #FFFFFF;
            font-family: "Montserrat", sans-serif;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #lista-ingressos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card-ingresso {
            background-color: #160F29;
            border: 1px solid #B22282;
            border-radius: 0.6rem;
            padding: 1.5rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.2rem;
        }

        .card-ingresso h3 {
            color: #E25583;
            font-size: 1.25rem;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid #302158;
            padding-bottom: 0.5rem;
        }

        .card-ingresso p {
            font-size: 0.95rem;
            color: #DDD;
            margin-bottom: 0.4rem;
        }

        .card-ingresso strong {
            color: #B22282;
        }

        .btn-cancelar-todos {
            background-color: transparent;
            border: 1px solid #e92f3b;
            color: #e92f3b;
            padding: 0.8rem 6rem;
            border-radius: 0.4rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-cancelar-todos:hover {
            background-color: #e92f3b;
            color: #FFFFFF;
        }

        @media (max-width: 768px) {
            body {
                padding: 1.2rem;
            }

            #lista-ingressos {
                grid-template-columns: 1fr;
                width: 100%;
            }

            .btn-cancelar-todos {
                width: 100%;
                padding: 0.8rem 1rem;
            }
        }
    </style>

</head>

<body>
    <div id="lista-ingressos"></div>

    <div style="text-align: center; margin-top: 2rem;">
        <button id="btnCancelarTodos" class="btn-cancelar-todos" onclick="cancelarTodosPedidos()"
            style="display: none;">
            Cancelar Pedidos
        </button>
    </div>
    <script>
        const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));
        const userId = usuario.idUsers;
        const API_URL = `http://localhost:5252/api/Ticket/user/${userId}`;

        // Guarda os ingressos carregados para sabermos quais pedidos cancelar
        let listaIngressosAtual = [];

        async function carregarHistorico() {
            const container = document.getElementById("lista-ingressos");
            const btnCancelarTodos = document.getElementById("btnCancelarTodos");

            try {
                const resposta = await fetch(API_URL);
                if (!resposta.ok) throw new Error("Não foi possível carregar seus ingressos.");

                const ingressos = await resposta.json();
                listaIngressosAtual = ingressos;

                if (ingressos.length === 0) {
                    container.innerHTML = "<p style='color: #c2c1c1;'>Você ainda não comprou nenhum ingresso.</p>";
                    btnCancelarTodos.style.display = "none"; // Esconde o botão se não houver ingressos
                    return;
                }

                container.innerHTML = "";
                btnCancelarTodos.style.display = "inline-block"; // Mostra o botão único lá embaixo

                ingressos.forEach(ticket => {
                    const orderId = ticket.idOrderFk;
                    const tipoIngresso = ticket.typeTicket === 2 ? "Meia-Entrada" : "Inteira";
                    const valorFormatado = Number(ticket.finalPriceTicket).toFixed(2).replace(".", ",");

                    const card = document.createElement("div");
                    card.className = "card-ingresso";

                    // Sem botão individual dentro do card!
                    card.innerHTML = `
                    <div>
                        <h3>Ingresso #${ticket.idTicket} (Pedido #${orderId})</h3>
                        <p><strong>Sessão:</strong> #${ticket.idSessionFk} | <strong>Poltrona:</strong> ${ticket.seatNumberTicket}</p>
                        <p><strong>Tipo:</strong> ${tipoIngresso}</p>
                        <p><strong>Valor Pago:</strong> R$ ${valorFormatado}</p>
                    </div>
                `;

                    container.appendChild(card);
                });

            } catch (erro) {
                console.error(erro);
                container.innerHTML = `<p style="color: #e92f3b;">Erro: ${erro.message}</p>`;
            }
        }

        // Cancela todos os pedidos distintos encontrados no histórico
        async function cancelarTodosPedidos() {
            if (!confirm("Deseja realmente cancelar TODOS os seus pedidos e liberar os assentos?")) return;

            // Pega apenas os números de pedidos únicos (ex: se tem 3 ingressos no pedido #1, chama o DELETE só 1 vez para o #1)
            const pedidosUnicos = [...new Set(listaIngressosAtual.map(t => t.idOrderFk))];

            try {
                for (const orderId of pedidosUnicos) {
                    const resposta = await fetch(`http://localhost:5252/api/Ticket/cancelar/${orderId}/${userId}`, {
                        method: "DELETE"
                    });

                    if (!resposta.ok) {
                        const erro = await resposta.json();
                        throw new Error(erro.message || `Erro ao cancelar pedido #${orderId}`);
                    }
                }

                alert("Pedidos cancelados com sucesso!");
                carregarHistorico(); // Atualiza a tela
            } catch (erro) {
                alert("Erro ao cancelar: " + erro.message);
            }
        }

        carregarHistorico();
    </script>
</body>

</html>
