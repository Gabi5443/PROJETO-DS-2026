<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários</title>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
    <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0F0A1C;
            font-family: "Sniglet", system-ui;
        }

        .voltar {
            display: inline-block;
            margin: 2%;
            text-decoration: none;
            padding: 0.6rem 0.9rem;
            border-radius: 0.35rem;
            transition: 0.2s ease;
            text-align: center;
            color: #fff;
            background-color: #B22282;
        }

        .voltar:hover {
            filter: brightness(0.92);
            transform: translateY(-1px);
        }

      .tabela {
            width: 90%;
            justify-self: center;
            align-items: center;
            border-radius: 0.7rem;
            border: 1px solid #B22282;
            background-color: #160F29;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        .tabela th,
        .tabela td {
            padding: 1.2rem;
            text-align: left;
        }

        .tabela th {
            background-color: #302158;
            border-radius: 5px;
            color: white;
            font-size: 0.95rem;
            font-weight: 400;
        }

        .tabela td {
            border-bottom: 1px solid #910296;
            color: #c2c1c1;
            font-size: 0.9rem;
        }

        .botoes {
            display: flex;
            gap: 15%;
            align-items: center;
            justify-self: center;
        }

        .botaoAlter,
        .botaoDelete {
            padding: 0.6rem 0.9rem;
            border-radius: 0.35rem;
            transition: 0.2s ease;
            text-align: center;
            color: #fff;
        }

        .botaoAlter {
            background-color: #ffbe33;
        }

        .botaoDelete {
            background-color: #e92f3b;
        }

        .botaoAlter:hover,
        .botaoDelete:hover {
            filter: brightness(0.92);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <a href="index.html" class="voltar">Voltar</a>
    <table class="tabela">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Tipo</th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nome</td>
                <td>Email</td>
                <td>Tipo</td>
                <td>Foto</td>
                <td>
                    <div class="botoes">
                        <div class="botaoAlter">Alterar</div>
                        <div class="botaoDelete">Deletar</div>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
