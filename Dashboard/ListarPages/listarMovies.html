<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes</title>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0F0A1C;
            font-family: "Sniglet", system-ui;
        }

        header {
            display: flex;
            justify-content: space-between;
        }

        .voltar {
            display: inline-block;
            margin: 2%;
            text-decoration: none;
            padding: 0.6rem 0.9rem;
            border-radius: 0.35rem;
            transition: 0.2s ease;
            text-align: center;
            color: #fff;
            background-color: #B22282;
        }

        .criar {
            display: inline-block;
            margin: 2%;
            margin-right: 5%;
            text-decoration: none;
            padding: 0.6rem 0.9rem;
            border-radius: 0.35rem;
            transition: 0.2s ease;
            text-align: center;
            color: #fff;
            background-color: #338a0a;
        }

        .criar:hover,
        .voltar:hover {
            filter: brightness(0.92);
            transform: translateY(-1px);
        }

        .tabela {
            width: 90%;
            justify-self: center;
            align-items: center;
            border-radius: 0.4rem;
            border: 1px solid #B22282;
            background-color: #160F29;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        .tabela th,
        .tabela td {
            padding: 1.2rem;
            text-align: left;
        }

        .tabela th {
            background-color: #302158;
            color: white;
            font-size: 0.95rem;
            font-weight: 400;
        }

        .tabela td {
            border-bottom: 1px solid #910296;
            color: #c2c1c1;
            font-size: 0.9rem;
        }

        .foto-filme {
            width: 150px;
            height: 85px;
            object-fit: cover;
            border-radius: 0.3rem;
            display: block;
        }

        .botoes {
            display: flex;
            gap: 15%;
            align-items: center;
            justify-self: center;
        }

        .botaoAlter,
        .botaoDelete {
            padding: 0.6rem 0.9rem;
            border-radius: 0.35rem;
            transition: 0.2s ease;
            text-align: center;
            color: #fff;
        }

        .botaoAlter {
            background-color: #ffbe33;
        }

        .botaoDelete {
            background-color: #e92f3b;
        }

        .botaoAlter:hover,
        .botaoDelete:hover {
            filter: brightness(0.92);
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <header>
        <a href="../index.html" class="voltar">Voltar</a>
        <a href="../CriarPages/CreateMovie.html" class="criar"> + Adicionar Filme</a>
    </header>
    <table class="tabela">
        <thead>
            <tr>
                <th>Titulo</th>
                <th>Sinopse</th>
                <th>Duração</th>
                <th>Gênero</th>
                <th>Classificação</th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="lista-filmes">
            <tr>
                <td colspan="7" style="text-align: center;">Carregando filmes...</td>
            </tr>
        </tbody>
    </table>
    <script src="../Scripts/movie.js"></script>
</body>

</html>
