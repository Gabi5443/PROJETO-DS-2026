<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmes</title>
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #190047;
            font-family: "Sniglet", system-ui;
        }

        .tabela {
            width: 90%;
            margin-top: 5%;
            justify-self: center;
            align-items: center;
            border-radius: 0.7rem;
            
            background-color: #240461;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
        }

        .tabela th,
        .tabela td {
            padding: 1.2rem;
            text-align: left;
        }

        .tabela th {
            background-color: #3c1d77;
            border-radius: 5px;
            color: white;
            font-size: 0.95rem;
            font-weight: 400;
        }

        .tabela td {
            border-bottom: 1px solid #910296;
            color: #c2c1c1;
            font-size: 0.9rem;
        }

        .botoes {
            display: flex;
            gap: 15%;
            align-items: center;
            justify-self: center;
        }

        .botaoAlter,
        .botaoDelete {
            padding: 0.6rem 0.9rem;
            border-radius: 0.35rem;
            transition: 0.2s ease;
            text-align: center;
            color: #fff;
        }

        .botaoAlter {
            background-color: #ffbe33;
        }

        .botaoDelete {
            background-color: #e92f3b;
        }

        .botaoAlter:hover,
        .botaoDelete:hover {
            filter: brightness(0.92);
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <table class="tabela">
        <thead>
            <tr>
                <th>Titulo</th>
                <th>Sinopse</th>
                <th>Duração</th>
                <th>Gênero</th>
                <th>Classificação</th>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Titulo</td>
                <td>Sinopse</td>
                <td>Duração</td>
                <td>Gênero</td>
                <td>Classificação</td>
                <td>Foto</td>
                <td>
                    <div class="botoes">
                        <div class="botaoAlter">Alterar</div>
                        <div class="botaoDelete">Deletar</div>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
