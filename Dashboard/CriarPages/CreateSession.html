<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Sessão</title>
</head>

<body>
    <div class="createCard">
        <form>
            <div class="formGroup">
                <label for="Filme">Filme:</label>
                <select name="idMovieFk" id="idMovieFk">
                    <option value="" disabled selected>Selecione um filme</option>
                </select>
            </div>

            <div class="formGroup">
                <label for="Preco">Preço:</label>
                <input type="number" name="PriceSession" id="PriceSession">
            </div>

            <div class="formGroup">
                <label for="Data">Data:</label>
                <input type="datetime" name="ShowTimeSession" id="ShowTimeSession">
            </div>

            <div class="formGroup">
                <label for="Sala">Sala:</label>
                <select name="idRoomFk" id="idRoomFk">
                    <option value="" disabled selected>Selecione uma sala</option>
                </select>
            </div>
        </form>
    </div>
</body>

</html>
