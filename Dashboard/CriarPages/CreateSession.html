
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Sessão</title>

    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0F0A1C;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }

        .form-container {
            background-color: #160F29;
            padding: 32px;
            border-radius: 12px;
            width: 100%;
            max-width: 30rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 1.5rem;
            font-family: "Orbitron", sans-serif;
            color: #f3f4f6;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            font-family: "Sniglet", system-ui;
        }

        .formItem {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            color: #ffffff;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2D1E54;
            background: linear-gradient(145deg, #1A1230, #130C24);
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            transform: translateY(-4px);
            border-color: #B22282;
        }

        select {
            cursor: pointer;
        }

        select option {
            background-color: #160F29;
            color: #ffffff;
        }

        button {
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #B22282;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2D1E54;
           
        }
    </style>
</head>

<body>
    <div class="form-container">

        <h2>Cadastrar Nova Sessão</h2>

        <form id="CreateSession">

            <div class="formItem">
                <label for="idMovieFk">Filme</label>
                <select name="idMovieFk" id="idMovieFk" required>
                    <option value="" disabled selected>Selecione um filme</option>
                </select>
            </div>

            <div class="formItem">
                <label for="PriceSession">Preço (R$)</label>
                <input type="number" name="PriceSession" id="PriceSession" step="0.01" min="0" required>
            </div>

            <div class="formItem">
                <label for="ShowTimeSession">Data </label>
                <input type="date" name="dataSession" id="dataSession" required>
            </div>

             <div class="formItem">
                <label for="ShowTimeSession">Horário</label>
                <input type="time" name="timeSession" id="timeSession" required>
            </div>

            <div class="formItem">
                <label for="idRoomFk">Sala</label>
                <select name="idRoomFk" id="idRoomFk" required>
                    <option value="" disabled selected>Selecione uma sala</option>
                </select>
            </div>

            <button type="submit">Cadastrar Sessão</button>

        </form>
    </div>

    <script src="../Scripts/session.js"></script>
</body>
</html>
