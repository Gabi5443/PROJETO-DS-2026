<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Movie</title>
</head>
<body>
   <form id="CreateMovie">

    <input type="text" name="TitleMovie" placeholder="Título" required>

    <input type="text" name="SynopsisMovie" placeholder="Sinopse" required>

    <input type="number" name="DurationMovie" placeholder="Duração em minutos" required>

    <input type="text" name="GenreMovie" placeholder="Gênero" required>

    <input type="number" name="AgeRatingMovie" placeholder="Classificação indicativa" required>

    <input type="file" name="PhotoMovie" accept="image/*" required>

    <button type="submit">Cadastrar Filme</button>

</form>

<script src="../Scripts/movie.js"></script>
</body>
</html>
