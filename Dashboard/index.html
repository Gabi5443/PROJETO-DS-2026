<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Movieing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <style>

        

        * {
            box-sizing: border-box;
            border: 0;
            padding: 0;
            margin: 0;
        }

        body {
            background-color: #0F0A1C;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        
        .header {
            height: 3.5rem;
            padding: 0 2.5rem;
            background-color: #160F29;
            border-bottom: 1px solid #2A1D4C;
            display: flex;
            align-items: center;
             flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
        }

        .degrade {
            font-size: 1.6rem; 
            font-weight: 800;
            display: inline-flex;
            letter-spacing: 2px;
            font-family: "Orbitron", sans-serif;
        }

.degrade span:nth-child(1) { color: #5B2C6F; } 
.degrade span:nth-child(2) { color: #76327E; } 
.degrade span:nth-child(3) { color: #92388C; }
.degrade span:nth-child(4) { color: #B03E98; } 
.degrade span:nth-child(5) { color: #CE47A2; } 
.degrade span:nth-child(6) { color: #E25583; } 
.degrade span:nth-child(7) { color: #EC696A; } 
.degrade span:nth-child(8) { color: #F27D52; } 

        .header-info {

           display: flex;
           gap: 2rem;
           align-items: center;
           
        }

        .listar{
            text-decoration: none;
            gap: 1rem;
            font-family: "Orbitron", sans-serif;
            color: #E25583;
            
        }

    

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .grid {
            display: grid;
            width: 90%;
             max-width: 1200px;
            gap: 1.5rem;
        }

        .cardsGrid {
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 20vh;
            grid-template-areas:
                "users movie movie"
                "tickets session session"
                "tickets room room";
        }

        .cMovies { grid-area: movie; }
        .cUsers { grid-area: users; }
        .cTickets { grid-area: tickets; }
        .cRooms { grid-area: room; }
        .cSession { grid-area: session; }

       
        .item {
            background: linear-gradient(145deg, #1A1230, #130C24);
            border: 1px solid #2D1E54;
            border-radius: 0.3rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        .item:hover {
            transform: translateY(-4px);
            border-color: #B22282;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            color: #A799C7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            color: #B22282;
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 2rem;
            
        }




        /*Responsividade*/
           /* Tablets e telas médias */
        @media (max-width: 1200px) {
            .header {
                padding: 1.5rem 2rem;
                align-items: center;
                
            }

            .cardsGrid {
             grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: minmax(300px, auto);
                grid-template-areas:
                    "users movie"
                    "tickets session"
                    "tickets room";
            }
        }

         
          /* Celulares -> mantém a logo e os card na mesma linha*/
        @media (max-width: 600px) {
            .header {
                padding: 0.6rem 0.8rem;
                gap: 0.5rem;
            }

            .degrade {
                font-size: 1.05rem;
                letter-spacing: 1px;
            }

            .header-info {
                gap: 0.65rem;
            }

            .listar {
                font-size: 0.72rem;
            }

            .main {
                padding: 1.2rem;
                align-items: flex-start;
            }

            .grid {
                width: 100%;
                gap: 1rem;
            }

            .cardsGrid {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "users"
                    "movie"
                    "tickets"
                    "session"
                    "room";
            }

            .card-value {
                font-size: 1.75rem;
            }
        }

/* TVs Full HD e Monitores Grandes */
        @media (min-width: 1600px) {
            html {
                font-size: 20px;
            }

            .grid {
                max-width: 1800px;
                gap: 2rem;
            }

            .cardsGrid {
                grid-auto-rows: minmax(180px, 24vh);
            }

            .card-value {
                font-size: 2.8rem;
            }

            
        }


 @media (min-width: 2500px) { /*Setando o max-widht bem grande para a tv*/
            html {
                font-size: 26px;
            }



            .grid {
                max-width: 2600px;
            }

            .header {
                padding: 4rem 3rem;
                gap: 0.5rem;
            }

               .degrade {
                font-size: 3rem;
                letter-spacing: 1px;
            }
            .listar {
                font-size: 2rem;
            }

            .card-header {
           
            font-size: 2rem;
            
        }
        .card-value{
            font-size: 3rem;
        }



        }

    </style>
</head>
<body>

    <div class="header">
        <div class="title">
            <div class="degrade">
                <span>M</span>
                <span>O</span>
                <span>V</span>
                <span>I</span>
                <span>E</span>
                <span>I</span>
                <span>N</span>
                <span>G</span>
            </div>
        </div>
        <div class="header-info">
            <a class="listar" href="ListarPages/listarMovies.html">Filmes</a>
            <a class="listar" href="ListarPages/listarUsers.html">Usuários</a>
            <a class="listar" href="ListarPages/listarSession.html">Sessões</a>
          
        </div>
    </div>

    <div class="main">
        <section class="grid cardsGrid">
            <div class="item cUsers">
                <div class="card-header"><span>Users</span></div>
                <div class="card-value" id="UsersDash"></div>
                
            </div>

            <div class="item cMovies">
                <div class="card-header"><span>Movies em Cartaz</span></div>
                <div class="card-value" id="MoviesDash"></div>
                
            </div>

            <div class="item cTickets">
                <div class="card-header"><span>Tickets Vendidos</span></div>
                <div class="card-value" id="TicketsDash"></div>
                
            </div>

            <div class="item cSession">
                <div class="card-header"><span>Sessions Hoje</span></div>
                <div class="card-value" id="SessionsDash"></div>
                
            </div>

            <div class="item cRooms">
                <div class="card-header"><span>Rooms Ativas</span></div>
                <div class="card-value" id="RoomsDash"> </div>
                
            </div>
        </section>
    </div>
<script src="Scripts/dash.js"></script>
</body>
</html>
