<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>
</head>

<body>
    <div class="createCard">
        <form id="EditarUsers">
            <div class="formGroup">
                <label for="Nome">Nome:</label>
                <input type="text" name="NameUsers" id="NameUsers">
            </div>

            <div class="formGroup">
                <label for="Email">Email:</label>
                <input type="text" name="EmailUsers" id="EmailUsers">
            </div>

             <div class="formGroup">
                <label for="RoleUsers">Cargo:</label>
                <select name="RoleUsers" id="RoleUsers" required>
                    <option value="1">Cliente</option>
                    <option value="2">Funcionário</option>
                </select>
            </div>

            <div class="formGroup">
                <label>Foto Atual:</label>
                <img id="PreviewFoto" src="" alt="Foto de perfil" style="width: 100px; height: 85px; object-fit: cover; border-radius: 50%; display: block; margin-bottom: 8px;">
                
                <label for="PhotoUsers">Trocar Foto de Perfil:</label>
                <input type="file" id="PhotoUsers" name="PhotoUsers" accept="image/*">
            </div>

            <button type="submit">Editar Cliente</button>
        </form>
    </div>
    <script src="../Scripts/user.js"></script>
</body>

</html>
