<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;

    }

    body {
        background-color: #0F0A1C;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #ffffff;
    }

    .voltar {
        position: absolute;
        top: 20px;
        left: 20px;
        text-decoration: none;
        text-align: center;
        background-color: transparent;
        border: 1px solid #B22282;
        color: #B22282;
        padding: 0.6rem 1.1rem;
        border-radius: 0.4rem;
        font-family: "Sniglet", system-ui;
        cursor: pointer;
        transition: 0.2s ease;
    }

    .voltar:hover {
        background-color: #B22282;
        color: #fff;
    }


    .form-container {
        background-color: #160F29;
        padding: 32px;
        border-radius: 12px;
        width: 100%;
        max-width: 30rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    h2 {
        text-align: center;
        margin-bottom: 24px;
        font-size: 1.5rem;
        font-family: "Orbitron", sans-serif;
        color: #f3f4f6;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        font-family: "Sniglet", system-ui;
    }

    .formItem {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
    }

    label {
        color: #ffffff;
        font-size: 0.9rem;

    }

    input,
    textarea {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #2D1E54;
        background: linear-gradient(145deg, #1A1230, #130C24);
        color: #ffffff;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus {
        transform: translateY(-4px);
        border-color: #B22282;
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }

    input[type="file"] {
        padding: 8px;
        cursor: pointer;
    }

    button {
        margin-top: 8px;
        padding: 14px;
        border: none;
        border-radius: 6px;
        background-color: #B22282;
        color: #ffffff;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    button:hover {
        background-color: #2D1E54;
    }

    @media (max-width: 768px) {
        body {
            flex-direction: column;
            justify-content: flex-start;
            gap: 1rem;
        }

        .voltar {
            position: static;
            align-self: flex-start;
            margin: 0;
            padding: 0.6rem 1rem;
        }
    }

    @media (min-width: 1920px) {
        .voltar {
            padding: 1rem 1.8rem;
            font-size: 1.3rem;
            border-radius: 0.5rem;
        }
    }
</style>

<body>
    <a href="../ListarPages/listarUsers.html" class="voltar">Voltar</a>
    <div class="form-container">
        <div class="createCard">
            <form id="EditarUsers">
                <div class="formGroup">
                    <label for="Nome">Nome:</label>
                    <input type="text" name="NameUsers" id="NameUsers">
                </div>

                <div class="formGroup">
                    <label for="Email">Email:</label>
                    <input type="text" name="EmailUsers" id="EmailUsers">
                </div>

                <div class="formGroup">
                    <label for="RoleUsers">Cargo:</label>
                    <select name="RoleUsers" id="RoleUsers" required>
                        <option value="1">Cliente</option>
                        <option value="2">Funcionário</option>
                    </select>
                </div>

                <div class="formGroup">
                    <label>Foto Atual:</label>
                    <img id="PreviewFoto" src="" alt="Foto de perfil"
                        style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; display: block; margin-bottom: 8px;">

                    <label for="PhotoUsers">Trocar Foto de Perfil:</label>
                    <input type="file" id="PhotoUsers" name="PhotoUsers" accept="image/*">
                </div>

                <button type="submit">Editar Cliente</button>
            </form>
        </div>
    </div>
    <script src="../Scripts/user.js"></script>
</body>

</html>
