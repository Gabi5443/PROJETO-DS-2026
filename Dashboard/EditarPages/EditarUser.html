<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>
</head>

<body>
    <div class="createCard">
        <form id="EditarUsers">
            <div class="formGroup">
                <label for="Nome">Nome:</label>
                <input type="text" name="NameUsers" id="NameUsers">
            </div>

            <div class="formGroup">
                <label for="Email">Email:</label>
                <input type="text" name="EmailUsers" id="EmailUsers">
            </div>

            <div class="formGroup">
                <label for="Senha">Senha:</label>
                <input type="text" name="PasswordUsers" id="PasswordUsers">
            </div>

            <div class="formGroup">
                <label for="Foto">Foto de Perfil:</label>
                <input type="file" id="PhotoUsers" name="PhotoUsers" accept="image/*">
            </div>

            <button type="submit">Editar Cliente</button>
        </form>
    </div>
</body>

</html>
