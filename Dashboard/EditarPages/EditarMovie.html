<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Filme</title>
</head>
<body>
    <div class="createCard">
        <form id="EditarMovie">
            <div class="formGroup">
                <label for="Titulo">Título:</label>
                <input type="text" id="TitleMovie" name="TitleMovie">
            </div>
            
            <div class="formGroup">
                <label for="Sinopse">Sinopse:</label>
                <input type="text" id="SynopsisMovie" name="SynopsisMovie">
            </div>
            
            <div class="formGroup">
                <label for="Duração">Duração:</label>
                <input type="number" id="DurationMovie" name="DurationMovie">
            </div>
            
            <div class="formGroup">
                <label for="Genero">Gênero:</label>
                <input type="text" id="GenreMovie" name="GenreMovie">
            </div>
            
            <div class="formGroup">
                <label for="Classificacao">Classificação:</label>
                <input type="number" id="AgeRatingMovie" name="AgeRatingMovie">
            </div>
            
            <div class="formGroup">
                <label for="Foto">Foto Atual:</label>
                <img id="PreviewFoto" src="" alt="Capa atual" style="width: 150px; height: 85px; object-fit: cover; display: block; margin-bottom: 8px;">
                <label for="PhotoMovie">Trocar Foto:</label>
                <input type="file" id="PhotoMovie" name="PhotoMovie" accept="image/*">
            </div>
            
            <button type="submit">Editar Filme</button>
        </form>
    </div>
    <script src="../Scripts/movie.js"></script>
</body>
</html>
